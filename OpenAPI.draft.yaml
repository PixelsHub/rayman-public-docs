        - entityIDs
      properties:
        operationID:
          $ref: '#/components/schemas/UUID'
        result:
          type: string
          enum:
            - completed
        matchedCount:
          type: integer
          minimum: 0
        changedCount:
          type: integer
          minimum: 0
        unchangedCount:
          type: integer
          minimum: 0
        entityIDs:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
        parentID:
          oneOf:
            - $ref: '#/components/schemas/UUID'
            - type: 'null'
        requestedRootCount:
          type: integer
          minimum: 0
        rootMappings:
          type: array
          items:
            $ref: '#/components/schemas/BulkDuplicateRootMapping'
    BulkIssue:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable, language-independent code intended as the client localization key.
        message:
          type: string
          description: English fallback message. Clients may localize it using `code` and `params`.
        path:
          type: string
          description: JSON Pointer identifying the invalid request member.
        entityID:
          $ref: '#/components/schemas/UUID'
        params:
          type: object
          additionalProperties: true
          description: Interpolation parameters for a localized client message.
    BulkPreviewResult:
      type: object
      required:
        - previewID
        - acceptable
        - matchedCount
        - changedCount
        - unchangedCount
        - issueCount
        - issuesTruncated
        - issues
        - warnings
      properties:
        previewID:
          $ref: '#/components/schemas/UUID'
        acceptable:
          type: boolean
        matchedCount:
          type: integer
          minimum: 0
        changedCount:
          type: integer
          minimum: 0
        unchangedCount:
          type: integer
          minimum: 0
        issueCount:
          type: integer
          minimum: 0
        issuesTruncated:
          type: boolean
        issues:
          type: array
          items:
            $ref: '#/components/schemas/BulkIssue'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/BulkIssue'
    BulkError:
      type: object
      required:
        - error
        - message
        - operationID
        - rolledBack
        - issueCount
        - issuesTruncated
        - issues
      properties:
        error:
          type: string
        message:
          type: string
          description: English fallback summary.
        operationID:
          $ref: '#/components/schemas/UUID'
        rolledBack:
          type: boolean
          const: true
        issueCount:
          type: integer
          minimum: 1
        issuesTruncated:
          type: boolean
          description: Indicates whether the server omitted any issues from the response. The current implementation returns every issue and therefore reports false.
        issues:
          type: array
          items:
            $ref: '#/components/schemas/BulkIssue'
    EntityBulkExclusion:
      type: object
      properties:
        entityIDs:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
        subtreeRootIDs:
          type: array
          description: Roots of branches to exclude. Each excluded subtree includes its root.
          items:
            $ref: '#/components/schemas/UUID'
    EntityBulkTarget:
      type: object
      description: Use `variantID` or a non-empty union of `entityIDs` and `subtreeRootIDs`. Exclusions may be used with either form and always win.
      properties:
        entityIDs:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
        subtreeRootIDs:
          type: array
          description: Every subtree includes its root; a leaf is therefore a valid subtree root.
          items:
            $ref: '#/components/schemas/UUID'
        variantID:
          $ref: '#/components/schemas/UUID'
        exclude:
          $ref: '#/components/schemas/EntityBulkExclusion'
    BulkLinkChanges:
      type: object
      properties:
        add:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
        remove:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
    BulkEntityChanges:
      type: object
      allOf:
        - $ref: '#/components/schemas/EntityUpdate'
        - type: object
          properties:
            tags:
              $ref: '#/components/schemas/BulkLinkChanges'
            signs:
              $ref: '#/components/schemas/BulkLinkChanges'
            relations:
              $ref: '#/components/schemas/BulkLinkChanges'
    BulkEntityOperation:
      type: object
      required:
        - target
        - changes
      properties:
        target:
          $ref: '#/components/schemas/EntityBulkTarget'
        changes:
          $ref: '#/components/schemas/BulkEntityChanges'
    BulkEntityOperationsRequest:
      type: object
      required:
        - operations
      properties:
        operations:
          type: array
          minItems: 1
          description: Targets are resolved from the initial hierarchy and changes are applied in array order.
          items:
            $ref: '#/components/schemas/BulkEntityOperation'
    BulkDeleteRequest:
      type: object
      required:
        - target
      properties:
        target:
          $ref: '#/components/schemas/EntityBulkTarget'
    BulkDuplicateRequest:
      type: object
      required:
        - subtreeRootIDs
      properties:
        subtreeRootIDs:
          type: array
          minItems: 1
          description: Roots of the independent subtrees to duplicate in full. The selection cannot contain both an ancestor and one of its descendants.
          items:
            $ref: '#/components/schemas/UUID'
    ProcedureStepSpecializedCore:
      type: object
      properties:
        order:
          type: integer
          minimum: 0
          description: Assigned automatically on create as the current step count plus one, and compacted after deletions.
        animation:
          type: string
    ProcedureStep:
      allOf:
        - $ref: '#/components/schemas/Entity'
        - $ref: '#/components/schemas/ProcedureStepSpecializedCore'
    ProcedureSpecializedCore:
      type: object
      properties:
        scene3dAssetID:
          oneOf:
            - $ref: '#/components/schemas/UUID'
            - type: 'null'
    Procedure:
      allOf:
        - $ref: '#/components/schemas/Entity'
        - type: object
          properties:
            stepCount:
              type: integer
              minimum: 0
            steps:
              type: array
              description: Present when `expand=steps` is requested.
              items:
                $ref: '#/components/schemas/ProcedureStep'
        - $ref: '#/components/schemas/ProcedureSpecializedCore'
    ProcedureCreate:
      allOf:
        - $ref: '#/components/schemas/EntityCore'
        - $ref: '#/components/schemas/ProcedureSpecializedCore'
    ProcedureUpdate:
      allOf:
        - $ref: '#/components/schemas/EntityUpdate'
        - type: object
          properties:
            scene3dAssetID:
              oneOf:
                - $ref: '#/components/schemas/UUID'
                - type: 'null'
              description: In PATCH requests, omitting this property keeps the current 3D scene unchanged. Sending `null` removes the scene.
    ProcedureStepCreate:
      allOf:
        - $ref: '#/components/schemas/EntityCore'
        - $ref: '#/components/schemas/ProcedureStepSpecializedCore'
        - type: object
          required:
            - procedureID
          properties:
            procedureID:
              $ref: '#/components/schemas/UUID'
            order:
              type: integer
              minimum: 0
              description: Ignored on create. The API assigns the next sequential order automatically.
    ProcedureStepUpdate:
      allOf:
        - $ref: '#/components/schemas/EntityUpdate'
        - type: object
          properties:
            order:
              type: integer
              minimum: 0
            animation:
              type: string
  responses:
    '204':
      description: Operation completed successfully.
    '400':
      description: Bad Request.
    '401':
      description: Authorization information is missing or invalid.
    '403':
      description: Forbidden.
    '404':
      description: Resource not found.
    '409':
      description: Conflict.
    '422':
      description: Request was syntactically valid but semantically invalid.
    5XX:
      description: Unexpected internal error.
    components-bulk-success:
      description: Operation completed, or preview evaluated.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/BulkOperationResult'
              - $ref: '#/components/schemas/BulkPreviewResult'
    components-bulk-error:
      description: Atomic bulk operation rejected; no requested mutation was partially applied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BulkError'
  parameters:
    components-idempotency-key:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional and recommended for safe retries. Reuse it only with the exact same request. The current in-memory implementation is lost on restart and is not shared across service instances; a shared persistent store is the recommended future improvement.
      schema:
        type: string
        maxLength: 200
    components-preview:
      name: preview
      in: query
      required: false
      description: When true, resolves and validates the operation without making changes. A successfully evaluated but unacceptable preview still returns HTTP 200 with `acceptable=false`.
      schema:
        type: boolean
        default: false

          in: query
          required: false
          description: Optional entity status filter. When omitted, the response includes every status allowed by the caller's permissions.
          schema:
            $ref: '#/components/schemas/EntityStatus'
        - name: parentID
          in: query
          required: false
          description: Parent entity filter. Use a UUID to filter direct children of that parent. Use the literal `null` to filter root entities (`parentID IS NULL`).
          schema:
            type: string
        - name: includeDescendants
          in: query
          required: false
          description: When `true` and `parentID` is a UUID, includes descendants up to `maxDepth`. Ignored when `parentID=null`.
          schema:
            type: boolean
        - name: maxDepth
          in: query
          required: false
          description: Maximum descendant distance from `parentID` when `includeDescendants=true`. Defaults to `1` (direct children); use `-1` for the full subtree. Values of `0` and less than `-1` are invalid. Ignored unless `parentID` is a UUID and `includeDescendants=true`.
          schema:
            default: 1
            oneOf:
              - const: -1
              - type: integer
                minimum: 1
        - name: expand
          in: query
          required: false
          description: 'CSV list of expansions. Supported values: assets, relations, signs, tags, parent, variant, ancestors'
          schema:
            type: string

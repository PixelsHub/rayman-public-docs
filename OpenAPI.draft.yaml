                file:
                  type: string
                  format: binary
                assetType:
                  type: string
                  description: 'Optional override. When omitted, it is inferred from the file MIME type: `image/*`, `video/*`, GLB, and PDF are classified as image, video, model_3d, and document respectively.'
                  enum:
                    - image
                    - video
                    - scene_3d
                    - model_3d
                    - document
                    - other
                metadata:
                  $ref: '#/components/schemas/Metadata'

        groupID:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
        description:
          type: string
    PermissionExplainEntityRef:
      type: object
      required:
        - entityID
        - name
      properties:
        entityID:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
        parentID:
          oneOf:
            - $ref: '#/components/schemas/UUID'
            - type: 'null'

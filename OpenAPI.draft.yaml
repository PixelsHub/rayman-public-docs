        scope:
          allOf:
            - $ref: '#/components/schemas/EntityGrantScope'
          default: self_and_descendants
        access:
          $ref: '#/components/schemas/GrantAccess'
        effect:
          $ref: '#/components/schemas/GrantEffect'
        variantIDs:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
          description: Applies to all variants when omitted or empty.
        status:
          type: array
          items:
            $ref: '#/components/schemas/EntityStatus'
          description: Applies to all entity statuses when omitted or empty.
    PrincipalGrantWrite:
      type: object
      description: |
        Unified principal grant payload.
        Provide exactly one block: `system` or `entity`.
      properties:
        system:
          $ref: '#/components/schemas/PrincipalSystemGrantCreate'
        entity:
          $ref: '#/components/schemas/PrincipalEntityGrantCreate'
    EntityPrincipalGrants:
      type: object
      required:
        - entityID

  /permissions/entities/{entityID}/explain:
    get:
      tags:
        - Permissions
      summary: Explains why a principal can or cannot access an entity.
      description: |
        Returns the current effective decision for the entity and the full grant chain
        considered during evaluation, including precedence between conflicting grants.
        The response is a precedence-ordered list of grants (direct user, group, everyone),
        each one marked with `applies=true|false`, and with the decisive grant explicitly flagged.
        Designed for admin/debug tooling and permission troubleshooting UIs.
      parameters:
        - name: entityID
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
        - name: userID
          in: query
          required: true
          description: User to evaluate (nominal explain).
          schema:
            $ref: '#/components/schemas/UUID'
        - name: expand
          in: query
          required: false
          description: 'CSV list of expansions. Supported values: entities,variants,groups'
          schema:
            type: string
      responses:
        '200':
          description: Operation completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionExplainEntityAccess'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
        5XX:
          $ref: '#/components/responses/5XX'

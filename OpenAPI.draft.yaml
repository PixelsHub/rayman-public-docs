        - deny
    SystemPermissionGrantCore:
      type: object
      required:
        - principalType
        - scope
        - access
        - effect
      properties:
        principalType:
          $ref: '#/components/schemas/PrincipalType'
        principalID:
          oneOf:
            - $ref: '#/components/schemas/UUID'
            - type: 'null'
          description: Required for `user` and `group`. Must be null for `everyone`.
        scope:
          $ref: '#/components/schemas/SystemPermissionScope'
        access:
          $ref: '#/components/schemas/GrantAccess'
        effect:
          $ref: '#/components/schemas/GrantEffect'
    SystemPermissionGrant:
      type: object
      allOf:
        - type: object
          properties:

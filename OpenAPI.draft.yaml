      type: object
      properties:
        variantID:
          $ref: '#/components/schemas/UUID'
        access:
          $ref: '#/components/schemas/AccessLevel'
          description: Effective access level for the current user on this entity variant.
        type:
          $ref: '#/components/schemas/EntityType'
        nameSingular:
          type: string
        namePlural:
          type: string
    PermissionExplainApplicableGrant:
      type: object
      required:
        - grant
        - source
        - precedence
        - applies
        - decisive
      properties:
        grant:
          $ref: '#/components/schemas/EntityPermissionGrant'
        source:
          type: string
          enum:
            - direct_user
            - group
            - everyone
          description: How this grant is linked to the evaluated user.
        precedence:
          type: integer
          description: Higher value means higher precedence in final conflict resolution.
        applies:
          type: boolean
          description: Whether the grant matches the current entity context (anchor/descendants, variants and status).
        decisive:
          type: boolean
          description: True only for the grant that determines the final effective access.
        sourceGroup:
          oneOf:
            - $ref: '#/components/schemas/PermissionExplainGroupRef'
            - type: 'null'
          description: Present when `source=group`.
        anchorEntity:
          oneOf:
            - $ref: '#/components/schemas/PermissionExplainEntityRef'
            - type: 'null'
          description: Expanded anchor entity where the grant is defined.
        variantRefs:
          type: array
          description: Expanded variants for `grant.variantIDs` when available.
          items:
            $ref: '#/components/schemas/EntityVariantRef'
    PermissionExplainEntityAccess:
      type: object
      required:
        - entityID
        - userID
        - entityStatus
        - effectiveAccess
        - allowed
        - evaluatedAt
        - applicableGrants
      properties:
        entityID:
          $ref: '#/components/schemas/UUID'
        userID:
          $ref: '#/components/schemas/UUID'
        entityStatus:
          $ref: '#/components/schemas/EntityStatus'
          description: Current status of the entity used during evaluation.
        effectiveAccess:
          oneOf:
            - $ref: '#/components/schemas/AccessLevel'
            - type: 'null'
          description: Effective access currently resolved for this principal on this entity.
        allowed:
          type: boolean
        evaluatedAt:
          $ref: '#/components/schemas/Timestamp'
        applicableGrants:
          type: array
          description: |
            Grants affecting this user for the resource context, sorted by precedence (highest first).
            Includes direct-user, group and everyone grants.
          items:
            $ref: '#/components/schemas/PermissionExplainApplicableGrant'
    EntityVariant:

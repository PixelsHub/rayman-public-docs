          oneOf:
            - $ref: '#/components/schemas/UUID'
            - type: 'null'
        sourceGrantID:
          oneOf:
            - $ref: '#/components/schemas/UUID'
            - type: 'null'
    EffectiveUserPermissions:
      type: object
      required:

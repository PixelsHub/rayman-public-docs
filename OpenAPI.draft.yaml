        - descendants
        - self_and_descendants
    EntityStatus:
      type: string
      enum:
        - draft
        - published
        - archived
    EntityPermissionGrantCore:
      type: object
      required:
        - principalType
        - access
        - effect
      properties:
        principalType:
          $ref: '#/components/schemas/PrincipalType'
        principalID:
          oneOf:
            - $ref: '#/components/schemas/UUID'

openapi: 3.1.0
info:
  title: PixelsHub Rayman
  description: |
    Draft contract for the Rayman 1.x API aligned with the new entity-based data model.
    Authentication accepts both bearer JWT headers and the `rayman_auth` cookie.
  contact:
    email: desarrollo@pixels-hub.com
  license:
    name: All Rights Reserved
    url: https://choosealicense.com/no-permission/
  version: 1.0.0-draft.1
servers:
  - url: https://rayman.pixels-hub.com/dev/api
    description: Development server
  - url: http://localhost/rayman/api
    description: Local server
  - url: https://cableo.es/v1/api
    description: Production server
security:
  - jwt: []
tags:
  - name: Authentication
  - name: Users
  - name: Actors
  - name: Permission Groups
  - name: Permissions
  - name: Entity Variants
  - name: Entity Variants > Children
  - name: Entity Variants > Signs
  - name: Entity Variants > Tags
  - name: Entities
  - name: Entities > Assets
  - name: Entities > Relations
  - name: Entities > Signs
  - name: Entities > Tags
  - name: Assets
  - name: Signs > Icons
  - name: Procedures
  - name: Procedures > Steps
paths:
  /auth/login:
    post:
      tags:
        - Authentication
      security: []
      summary: Authenticates a user and returns a JWT token while also setting the browser auth cookie
      description: |
        The authenticated session can be used in two ways:
        - as a bearer token in the `Authorization` header
        - as the `rayman_auth` cookie in browser-based clients

        Tenant selection flow:
        - If the user only has access to one organization, the returned token is already bound to that organization.
        - If the user has access to multiple organizations and no `organizationSlug` is provided, the returned token has no tenant selected and the response includes the organizations available for selection.
        - A token without tenant selection is only valid for authentication endpoints.
        - Tenant-based module endpoints must reject a token without selected organization with `401` or `403`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - password
                - user
              properties:
                user:
                  type: string
                password:
                  type: string
                organizationSlug:
                  type: string
                  description: Organization slug to bind the returned token to a tenant.
              example:
                user: expert@demo.com
                password: demo
        required: true
      responses:
        '200':
          description: |
            Authenticated session.
            The same JWT is returned in the response body for programmatic clients and also set as the `rayman_auth` cookie for browser clients.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: xxxxx.yyyyy.zzzzz
                  actor:
                    $ref: '#/components/schemas/Actor'
                  organization:
                    $ref: '#/components/schemas/OrganizationSelection'
                    description: Present when the returned token is bound to a tenant.
                  displayName:
                    type: string
                    description: Present when the user must choose a tenant in a second step.
                  organizations:
                    type: array
                    description: Present only when the user must choose a tenant in a second step.
                    items:
                      $ref: '#/components/schemas/OrganizationSelection'
        '400':
          description: Bad Request. *user* or *password* is not valid.
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
        5XX:
          $ref: '#/components/responses/5XX'
  /auth/refresh:
    post:
      tags:
        - Authentication
      security:
        - cookie: []
        - jwt: []
      summary: Restores and renews a browser session
      description: |
        Accepts a valid JWT from the `rayman_auth` HttpOnly cookie or from the `Authorization: Bearer <token>` header.
        When both are supplied, a valid cookie takes precedence; if one credential is invalid and the other is valid,
        the valid credential is used. If neither is valid, the response is `401`.

        The response has the same shape as a successful tenant-bound login: it returns a newly issued bearer JWT,
        refreshes the `rayman_auth` cookie, includes the authenticated actor, and preserves the `org` tenant claim
        from the credential used to authenticate the request. Browser clients must send the request with credentials
        enabled; the cookie is HttpOnly and is not intended to be read by client-side code.
      responses:
        '200':
          description: Renewed authenticated session. Tenant-bound sessions include `actor` and `organization`; sessions without a selected tenant include `displayName` and `organizations`.
          content:
            application/json:
              schema:
                type: object
                required:
                  - token
                properties:
                  token:
                    type: string
                    description: Newly issued bearer JWT.
                    example: xxxxx.yyyyy.zzzzz
                  actor:
                    $ref: '#/components/schemas/Actor'
                  organization:
                    $ref: '#/components/schemas/OrganizationSelection'
                    description: Present when the renewed token is bound to a tenant.
                  displayName:
                    type: string
                    description: Present when the renewed token has no tenant selected.
                  organizations:
                    type: array
                    description: Present only when the renewed token has no tenant selected.
                    items:
                      $ref: '#/components/schemas/OrganizationSelection'
        '401':
          $ref: '#/components/responses/401'
        5XX:
          $ref: '#/components/responses/5XX'
  /auth/login/organizations:
    get:
      tags:
        - Authentication
      summary: Returns organizations accessible by the authenticated user
      description: |
        Intended for the second step of the multi-tenant login flow, when the current token is authenticated but not yet bound to a tenant.
      responses:
        '200':
          description: List of organizations the user can access
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationSelection'
        '401':
          $ref: '#/components/responses/401'
        5XX:
          $ref: '#/components/responses/5XX'
  /auth/login/organizations/{organizationSlug}:
    get:
      tags:
        - Authentication
      summary: Returns one organization if the authenticated user can access it
      parameters:
        - in: path
          name: organizationSlug
          required: true
          description: Organization slug.
          schema:
            type: string
      responses:
        '200':
          description: Organization data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSelection'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        5XX:
          $ref: '#/components/responses/5XX'
  /auth/login/organizations/{organizationSlug}/select:
    post:
      tags:
        - Authentication
      summary: Selects an organization and refreshes the JWT so it becomes bound to that tenant
      description: |
        Returns a token valid for tenant-based module APIs.
        The token is returned in the response body and also set as the `rayman_auth` cookie.
      parameters:
        - in: path
          name: organizationSlug
          required: true
          description: Organization slug.
          schema:
            type: string
      responses:
        '200':
          description: Refreshed token bound to selected organization
          content:
            application/json:
              schema:
                type: object
                required:
                  - token
                  - actor
                  - organization
                properties:
                  token:
                    type: string
                    example: xxxxx.yyyyy.zzzzz
                  actor:
                    $ref: '#/components/schemas/Actor'
                  organization:
                    $ref: '#/components/schemas/OrganizationSelection'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
        5XX:
          $ref: '#/components/responses/5XX'
  /auth/password/change:
    post:
      tags:
        - Authentication
      security:
        - jwt: []
        - {}
      summary: Changes a password either for the authenticated user or by using a one-time reset token
      description: |
        This endpoint supports two valid flows:
        - authenticated password change, using `oldPassword` + `newPassword`
        - password reset completion, using a one-time `token` + `newPassword`

        The request body determines which flow is being used.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - required:
                    - oldPassword
                    - newPassword
                  description: Used for an authenticated user to change their password
                  properties:
                    oldPassword:
                      type: string
                      format: password
                    newPassword:
                      type: string
                      format: password
                  example:
                    oldPassword: myOldPassword
                    newPassword: newPassword
                - required:
                    - token
                    - newPassword
                  description: Used for a non authenticated user to change their password, identifying themselves with a previously given token, for example password recovery
                  properties:
                    token:
                      type: string
                    newPassword:
                      type: string
                      format: password
                  example:
                    token: HIKEOEJKMXX
                    newPassword: newPassword
      responses:
        '204':
          description: Password changed succesfully.
        '400':
          description: Bad Request. *oldPassword* is wrong or *newPassword* is not valid.
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
        5XX:
          description: Unexpected Error
  /auth/password/reset:
    post:
      tags:
        - Authentication
      security: []
      summary: Sends a password reset email with a one-time link to choose a new password
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
          application/json:
            schema:
              properties:
                email:
                  type: string
                  format: email
        required: true
      responses:
        '204':
          description: Password reset succesfully.
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          description: Not Found. User ID or email doesn't exist.
        '422':
          $ref: '#/components/responses/422'
        5XX:
          description: Unexpected Error
  /users:
    get:
      tags:
        - Users
      summary: Gets an array of users.
      parameters:
        - name: disabled
          in: query
          required: false
          schema:
            type: boolean
        - name: email
          in: query
          required: false
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Operation completed successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        5XX:
          $ref: '#/components/responses/5XX'
    post:
      tags:
        - Users
      summary: Creates a new user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCore'
      responses:
        '200':
          description: Operation completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        5XX:
          $ref: '#/components/responses/5XX'
  /users/current:
    get:
      tags:
        - Users
      summary: Gets the current authenticated user.
      responses:
        '200':
          description: Operation completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        5XX:
          $ref: '#/components/responses/5XX'
  /users/{userID}:
    get:
      tags:
        - Users
      summary: Gets a user by ID.
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: Operation completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        5XX:
          $ref: '#/components/responses/5XX'
    patch:
      tags:
        - Users
      summary: Updates a user.
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Operation completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        5XX:
          $ref: '#/components/responses/5XX'
    delete:
      tags:
        - Users
      summary: Deletes a user.
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '204':
          $ref: '#/components/responses/204'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        5XX:
          $ref: '#/components/responses/5XX'
  /actors:
    get:
      tags:
        - Actors
      summary: Gets actors visible in the current tenant.
      parameters:
        - name: expand
          in: query
          required: false
          description: 'CSV list of expansions. Supported values: user'
          schema:
            type: string
      responses:
        '200':
          description: Operation completed successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Actor'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        5XX:
          $ref: '#/components/responses/5XX'
  /actors/current:
    get:
      tags:
        - Actors
      summary: Gets the current authenticated actor and creates it if it does not exist yet.
      parameters:
        - name: expand
          in: query
          required: false
          description: 'CSV list of expansions. Supported values: user'
          schema:
            type: string
      responses:
        '200':
          description: Operation completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        5XX:
          $ref: '#/components/responses/5XX'
  /actors/{actorID}:
    get:
      tags:
        - Actors
      summary: Gets an actor by ID.
      parameters:
        - name: actorID
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
        - name: expand
          in: query
          required: false
          description: 'CSV list of expansions. Supported values: user'
          schema:
            type: string
      responses:
        '200':
          description: Operation completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        5XX:
          $ref: '#/components/responses/5XX'
  /permissions/groups:
    get:
      tags:
        - Permission Groups
      summary: Gets all permission groups for the current tenant.
      parameters:
        - name: expand
          in: query
          required: false
          description: 'CSV list of expansions. Supported values: users,grants'
          schema:
            type: string
      responses:
        '200':
          description: Operation completed successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PermissionGroup'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        5XX:
          $ref: '#/components/responses/5XX'
    post:
      tags:
        - Permission Groups
      summary: Creates a permission group.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionGroupCore'
      responses:
        '200':
          description: Operation completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionGroup'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        5XX:
          $ref: '#/components/responses/5XX'
  /permissions/groups/{groupID}:
    get:
      tags:
        - Permission Groups
      summary: Gets a permission group by ID.
      parameters:
        - name: groupID
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
        - name: expand
          in: query
          required: false
          description: 'CSV list of expansions. Supported values: users,grants'
          schema:
            type: string
      responses:
        '200':
          description: Operation completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionGroup'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        5XX:
          $ref: '#/components/responses/5XX'
    patch:
      tags:
        - Permission Groups
      summary: Updates a permission group.
      parameters:
        - name: groupID
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionGroupUpdate'
      responses:
        '200':
          description: Operation completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionGroup'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        5XX:
          $ref: '#/components/responses/5XX'
    delete:
      tags:
        - Permission Groups
      summary: Deletes a permission group.
      parameters:
        - name: groupID
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '204':
          $ref: '#/components/responses/204'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        5XX:
          $ref: '#/components/responses/5XX'
  /permissions/groups/{groupID}/users:
    get:
      tags:
        - Permission Groups
      summary: Gets the users currently assigned to a permission group.
      parameters:
        - name: groupID
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: Operation completed successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        5XX:
          $ref: '#/components/responses/5XX'
    post:
      tags:
        - Permission Groups
      summary: Adds users to a permission group.
      parameters:
        - name: groupID
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/UUID'
      responses:
        '204':
          $ref: '#/components/responses/204'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
        5XX:
          $ref: '#/components/responses/5XX'
    delete:
      tags:
        - Permission Groups
      summary: Removes users from a permission group.
      parameters:
        - name: groupID
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/UUID'
      responses:
        '204':
          $ref: '#/components/responses/204'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
        5XX:
          $ref: '#/components/responses/5XX'
  /permissions/users/{userID}:
    get:
      tags:
        - Permissions
      summary: Gets all permission grants for a specific user principal.
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
        - name: include
          in: query
          required: false
          description: 'CSV list of sections to include. Supported values: system,entities'
          schema:
            type: string
      responses:
        '200':
          description: Operation completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalPermissionBundle'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        5XX:
          $ref: '#/components/responses/5XX'
  /permissions/users/{userID}/effective:
    get:
      tags:
        - Permissions
      summary: Gets computed effective permissions for a specific user.
      description: |
        Supports `userID=current` to resolve the authenticated token user.
        This endpoint only returns:
        - effective system permissions
        - effective global entity permissions (`entityID = null` grants), resolved by `variant`
        It intentionally excludes entity-specific grants.
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            oneOf:
              - $ref: '#/components/schemas/UUID'
              - type: string
                enum:
                  - current
      responses:
        '200':
          description: Operation completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveUserPermissions'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
        5XX:
          $ref: '#/components/responses/5XX'
  /permissions/users/{userID}/grants:
    get:
      tags:
        - Permissions
      summary: Gets grants for a specific user principal.
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
        - name: type
          in: query
          required: false
          description: Filter by grant type.
          schema:
            type: string
            enum:
              - system
              - entity
        - name: scope
          in: query
          required: false
          description: Applies only when `type=system`.
          schema:
            $ref: '#/components/schemas/SystemPermissionScope'
        - name: entityID
          in: query
          required: false
          description: Applies only when `type=entity`.
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: Operation completed successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PrincipalGrant'
        '401':

            - prohibition
        iconText:
          type: string
    SignUpdate:
      type: object
      properties:
        name:
          type: string
        color:
          type: string
          minLength: 1
          maxLength: 24
        iconID:
          oneOf:
            - $ref: '#/components/schemas/UUID'
            - type: 'null'
        type:
          type: string
          enum:
            - icon
            - verification
            - warning
            - prohibition
        iconText:
          type: string
    VariantTagCreate:

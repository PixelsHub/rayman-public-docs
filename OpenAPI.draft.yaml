        system:
          type: array
          items:
            $ref: '#/components/schemas/EffectiveSystemPermission'
        globalEntity:
          type: array
          description: Computed global entity permissions (`entityID = null`) resolved for each variant.
          items:
            $ref: '#/components/schemas/EffectiveGlobalEntityPermission'
    PrincipalGrant:

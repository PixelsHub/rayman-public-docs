          type: string
        icon:
          oneOf:
            - $ref: '#/components/schemas/UUID'
            - type: 'null'
        metadataTemplate:
          $ref: '#/components/schemas/Metadata'
    VariantSignCreate:
      type: object
      required:
        - name

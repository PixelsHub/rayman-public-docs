      summary: Searches entities by text, tags, ancestor or status.
      parameters:
        - name: text
          in: query
          required: false
          description: Case-insensitive partial match against the entity name. Required unless tagIDs, parentID or status is provided.
          schema:
            type: string
        - name: includeDescription
          in: query
          required: false
          description: When true, text also matches the entity description. Defaults to false.
          schema:
            type: boolean
            default: false
        - name: tagIDs
          in: query
          required: false
          description: CSV list of tag UUIDs. Matches entities with any supplied tag.
          schema:
            type: string
        - name: parentID
          in: query
          required: false
          description: UUID of an ancestor entity. Matches all descendants but not the ancestor itself.
          schema:
            $ref: '#/components/schemas/UUID'
        - name: status
          in: query
          required: false
          description: Optional entity status filter. It combines with text, tagIDs and parentID using AND. When omitted, the response includes every status allowed by the caller's permissions.
          schema:
            $ref: '#/components/schemas/EntityStatus'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: expand
          in: query
          required: false

components:
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
    cookie:
      type: apiKey
      in: cookie
      name: rayman_auth
  schemas:
    UUID:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    AuditFields:
      type: object
      properties:
        createdBy:
          $ref: '#/components/schemas/UUID'
          description: Actor ID that created the resource.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedBy:
          $ref: '#/components/schemas/UUID'
          description: Actor ID that last updated the resource.
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    UserCore:
      type: object
      required:
        - email
        - name
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        surname1:
          type: string
          default: ''
        surname2:
          type: string
          default: ''
        info:
          type: string
          default: ''
        disabled:
          type: boolean
          default: false
        isOwner:
          type: boolean
        avatarAssetID:
          oneOf:
            - $ref: '#/components/schemas/UUID'
            - type: 'null'
          description: In PATCH requests, omitting this property keeps the current avatar unchanged. Sending `null` removes the avatar.
          default: false
    User:
      type: object
      allOf:
        - type: object
          properties:
            userID:
              $ref: '#/components/schemas/UUID'
            avatarAssetID:
              oneOf:
                - $ref: '#/components/schemas/UUID'
                - type: 'null'
        - $ref: '#/components/schemas/AuditFields'
        - $ref: '#/components/schemas/UserCore'
    Actor:
      type: object
      allOf:
        - type: object
          properties:
            actorID:
              $ref: '#/components/schemas/UUID'
            type:
              type: string
              enum:
                - user
                - user_deleted
                - support
                - service
            displayName:
              type: string
            avatarAssetID:
              oneOf:
                - $ref: '#/components/schemas/UUID'
                - type: 'null'
            userID:
              oneOf:
                - $ref: '#/components/schemas/UUID'
                - type: 'null'
            user:
              oneOf:
                - $ref: '#/components/schemas/User'
                - type: 'null'
        - $ref: '#/components/schemas/AuditFields'
    OrganizationSelection:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
          description: External tenant identifier used by the API.
        theme:
          oneOf:
            - type: string

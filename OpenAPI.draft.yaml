        - effect
      properties:
        scope:
          $ref: '#/components/schemas/SystemPermissionScope'
        access:
          $ref: '#/components/schemas/GrantAccess'
        effect:
          $ref: '#/components/schemas/GrantEffect'
    PrincipalEntityGrantCreate:
      type: object
      required:
        - access
        - effect

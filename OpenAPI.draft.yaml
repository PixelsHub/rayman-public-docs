              $ref: '#/components/schemas/BulkEntityCreateRequest'
      responses:
        '200':
          $ref: '#/components/responses/components-bulk-success'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/components-bulk-error'
        '409':
          $ref: '#/components/responses/components-bulk-error'
        '422':
          $ref: '#/components/responses/components-bulk-error'
        5XX:
          $ref: '#/components/responses/5XX'
    patch:
      tags:
        - Entities
      summary: Applies ordered entity changes to server-resolved targets in one transaction.
      description: |
        Every operation resolves its target from the hierarchy as it existed when the request began. Operations are then applied in request order and committed atomically.
        `entityIDs` and `subtreeRootIDs` may be combined; every subtree includes its root, including when the root is a leaf. `variantID` is an alternative positive selector. Exclusions always win.
        A `parentID` change is accepted only for an explicit `entityIDs` target. Tags and signs must exist and are assigned only to entities whose variant supports them; incompatible target/resource pairs are skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkEntityOperationsRequest'
      responses:
        '200':
          $ref: '#/components/responses/components-bulk-success'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/components-bulk-error'
        '409':
          $ref: '#/components/responses/components-bulk-error'
        '422':
          $ref: '#/components/responses/components-bulk-error'
        5XX:
          $ref: '#/components/responses/5XX'
  /entities/bulk/delete:
    parameters:
      - $ref: '#/components/parameters/components-idempotency-key'
      - $ref: '#/components/parameters/components-preview'
    post:
      tags:
        - Entities
      summary: Deletes explicit entities or server-resolved subtrees atomically.
      description: Entity deletion cascades through descendants. An exclusion is rejected when an included ancestor would still delete that entity through the cascade.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeleteRequest'
      responses:
        '200':
          $ref: '#/components/responses/components-bulk-success'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/components-bulk-error'
        '409':
          $ref: '#/components/responses/components-bulk-error'
        '422':
          $ref: '#/components/responses/components-bulk-error'
        5XX:
          $ref: '#/components/responses/5XX'
  /entities/bulk/duplicate:
    parameters:
      - $ref: '#/components/parameters/components-idempotency-key'
      - $ref: '#/components/parameters/components-preview'
    post:
      tags:
        - Entities
      summary: Duplicates multiple independent entity subtrees atomically.
      description: Each `subtreeRootID` identifies a root whose complete subtree is duplicated. Every duplicated root remains under its current parent. The response includes the generated IDs for all copies and a source-to-copy mapping for each requested root.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDuplicateRequest'
      responses:
        '200':
          $ref: '#/components/responses/components-bulk-success'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/components-bulk-error'
        '409':
          $ref: '#/components/responses/components-bulk-error'
        '422':
          $ref: '#/components/responses/components-bulk-error'
        5XX:
          $ref: '#/components/responses/5XX'
  /assets:

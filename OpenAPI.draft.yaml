      summary: Gets an image thumbnail, or redirects to the original while it is unavailable.
      description: Only JPEG and PNG image assets have generated thumbnails. If the requested thumbnail is not generated or its file is missing, returns a non-cacheable 302 redirect to `/assets/{assetID}/download`.

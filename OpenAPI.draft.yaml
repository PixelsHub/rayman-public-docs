          $ref: '#/components/schemas/EntityStatus'
        tagIDs:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
        signIDs:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
        assetIDs:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
        relatedEntityIDs:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
        entity3dMapping:
          $ref: '#/components/schemas/Entity3dMapping'
